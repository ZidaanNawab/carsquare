<svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Squircle background -->
  <rect width="300" height="300" rx="73" fill="#0A0A0A" />

  <!-- Cabin / Roof (white outer box) -->
  <rect x="51" y="69" width="198" height="66" rx="10" fill="#FFFFFF" />
  <!-- Windshield (black inner cutout) — narrower, centered -->
  <rect x="95" y="84" width="110" height="36" rx="6" fill="#0A0A0A" />

  <!-- Side mirrors — correctly positioned beside cabin -->
  <rect x="15" y="100" width="36" height="39" rx="6" fill="#FFFFFF" />
  <rect x="249" y="100" width="36" height="39" rx="6" fill="#FFFFFF" />

  <!-- Main body / bumper (white outer) -->
  <rect x="53" y="130" width="194" height="79" rx="12" fill="#FFFFFF" />

  <!-- Grill & headlight panel (black inner cutout) -->
  <rect x="68" y="144" width="164" height="40" rx="7" fill="#0A0A0A" />

  <!-- Green headlights -->
  <rect x="73" y="150" width="29" height="29" rx="5" fill="#22C55E" />
  <rect x="198" y="150" width="29" height="29" rx="5" fill="#22C55E" />

  <!-- Grill bars -->
  <rect x="112" y="155" width="76" height="7" rx="3.5" fill="#FFFFFF" />
  <rect x="112" y="170" width="76" height="7" rx="3.5" fill="#FFFFFF" />

  <!-- Wheels -->
  <rect x="55" y="199" width="55" height="33" rx="7" fill="#FFFFFF" />
  <rect x="190" y="199" width="55" height="33" rx="7" fill="#FFFFFF" />
</svg>
